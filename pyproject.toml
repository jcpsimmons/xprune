[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xprune"
version = "0.2.0"
description = "Delete your X posts older than N days through the official X API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Dr. Josh C. Simmons" }]
dependencies = []

[project.scripts]
xprune = "xprune.cli:main"

[tool.setuptools]
packages = ["xprune"]
